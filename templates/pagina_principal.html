<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página Principal | Loja</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}" />
  <link rel="stylesheet" href="/static/css/header.css" />
  <link rel="stylesheet" href="/static/css/footer.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main_pag_principal.css') }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
</head>

<body>
  {% include 'header.html' %}

  <main class="pagina__conteudo">

    <!-- Carrossel -->
    <section class="pagina__carrossel">
      <div id="carouselExampleIndicators" class="pagina__carrossel-container carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          {% for i in range(imagens|length) %}
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="{{ i }}" {% if i == 0 %}class="active"{% endif %} aria-current="true" aria-label="Slide {{ i + 1 }}"></button>
          {% endfor %}
        </div>
        <div class="carousel-inner">
          {% for img_url in imagens %}
            <div class="carousel-item {% if loop.index0 == 0 %}active{% endif %}">
              <img src="{{ img_url }}" class="d-block w-100" alt="Slide {{ loop.index }}">
            </div>
          {% endfor %}
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Próximo</span>
        </button>
      </div>
    </section>

    <!-- Categorias -->
    <section class="pagina__categorias">
      <div class="pagina__categorias-container">
        <h2 class="pagina__categorias-titulo">Categorias</h2>
        <div class="pagina__categorias-botoes">
          <a href="{{ url_for('produtos', cod_categoria=1) }}"><button class="btn btn-outline-primary">Calçados</button></a>
          <a href="{{ url_for('produtos', cod_categoria=2) }}"><button class="btn btn-outline-primary">Camisas</button></a>
          <a href="{{ url_for('produtos', cod_categoria=3) }}"><button class="btn btn-outline-primary">Bermudas</button></a>
          <a href="{{ url_for('produtos', cod_categoria=4) }}"><button class="btn btn-outline-primary">Moletons</button></a>
          <a href="{{ url_for('produtos', cod_categoria=5) }}"><button class="btn btn-outline-secondary">Todos</button></a>
        </div>
      </div>
    </section>

  </main>

  {% include 'footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
